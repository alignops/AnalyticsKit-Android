name: AI attribution

# Background audit only. It runs after commits land on main, never on pull requests, so it adds
# nothing to a PR's checks. It never blocks, fails, or warns: findings are info lines in the job log.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  attribution:
    name: Audit AI attribution
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            let notes;
            try {
              notes = await audit();
            } catch (error) {
              notes = ['Unable to audit AI attribution: ' + error.message];
            }
            for (const note of notes) core.info(note);
            if (!notes.length) core.info('AI attribution is valid for all declared AI-assisted commits.');

            async function audit() {
              // Git treats trailer keys case-insensitively, and the order inside the block carries no meaning,
              // so accept any case and any order. Some agents (Claude Code) add their coauthor line as a
              // separate paragraph, so the block is every trailing paragraph made only of trailer lines.
              const trailerLine = /^[A-Za-z0-9-]+:\s/;
              const coauthor = /^Co-authored-by: [^<>\n]+ <[^<>@\s]+@[^<>@\s]+>$/i;
              const level = /^AI-Assisted: (?:all|majority|minor)$/i;
              const tool = /^AI-Tool: (?!none$)[a-z0-9][a-z0-9._-]*$/i;
              const hasValidBlock = message => {
                const paragraphs = message.split(/\n[ \t]*\n/).map(paragraph => paragraph.split('\n'));
                const block = [];
                while (paragraphs.length && paragraphs.at(-1).every(line => trailerLine.test(line))) block.unshift(...paragraphs.pop());
                return block.length > 0
                  && block.some(line => coauthor.test(line))
                  && block.filter(line => level.test(line)).length === 1
                  && block.filter(line => tool.test(line)).length === 1;
              };
              const knownAgent = /^(?:Codex|Claude(?: Code)?|Gemini(?: CLI)?|(?:GitHub )?Copilot|Cursor|Antigravity|AI Assistant|AI Agent)$/i;
              const notes = [];
              let hasAICommit = false;
              for (const item of context.payload.commits ?? []) {
                const message = item.message.replace(/\r\n/g, '\n').replace(/\n+$/, '');
                const declaresAI = /^AI-(?:Assisted|Tool):/im.test(message)
                  || message.split('\n').some(line => knownAgent.test(line.match(/^Co-authored-by:\s*(.*?)\s*<[^<>]+>\s*$/i)?.[1] ?? ''))
                  || knownAgent.test(item.author?.name ?? '');
                if (!declaresAI) continue;
                hasAICommit = true;
                const levels = message.match(/^AI-Assisted:/gim) ?? [];
                const tools = message.match(/^AI-Tool:/gim) ?? [];
                if (!hasValidBlock(message) || levels.length !== 1 || tools.length !== 1) {
                  notes.push(`Commit ${item.id.slice(0, 12)} does not end with one trailer block holding Co-authored-by: Agent Name <email>, AI-Assisted: all|majority|minor, and AI-Tool: tool-id.`);
                }
              }
              if (!hasAICommit) return notes;
              // The PR line lives on the pull request that brought these commits to main, if there was one.
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: context.payload.after });
              const pr = prs.find(candidate => candidate.merged_at);
              if (!pr) return notes;
              const body = (pr.body ?? '').replace(/<!--[\s\S]*?-->/g, '').replace(/\r\n/g, '\n');
              // AI-Agents is the policy's key; AI-Assisted is the older key, still accepted.
              const prAttribution = body.match(/^AI-(?:Agents|Assisted):([^\n]*)$/im)?.[1].trim();
              if (!prAttribution || /^(?:none|all|majority|minor)$/i.test(prAttribution) || /[<>]/.test(prAttribution)) {
                notes.push(`PR #${pr.number} has no visible AI-Agents: Agent Name line identifying the actual agent(s).`);
              }
              return notes;
            }
